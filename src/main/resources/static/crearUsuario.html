</head>

                <div class="d-flex flex-column">
                    <h5 class="offcanvas-title mb-0 fw-bold">SISAJ</h5>

                <li class="nav-item"><a class="nav-link active" href="crearUsuario.html">Crear Usuario</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="farmacia.html">Farmacia</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="medico.html">Atención Médica</a></li>

    <div class="container mt-5 pt-4">
        <h2 class="mb-4 text-center" id="tituloFormulario">Registrar Nuevo Usuario</h2>
        
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form id="formularioUsuario" class="row g-3">
                    <input type="hidden" id="codigoUsuario">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Alias *</label>
                            <input type="text" id="alias" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DNI *</label>
                            <input type="text" id="dni" class="form-control">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Apellido Paterno *</label>
                            <input type="text" id="apellidoPaterno" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Apellido Materno *</label>
                            <input type="text" id="apellidoMaterno" class="form-control">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombres *</label>
                            <input type="text" id="nombres" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha de Nacimiento *</label>
                            <input type="date" id="fechaNacimiento" class="form-control">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Sueldo (S/.) *</label>
                            <input type="number" step="0.01" id="sueldo" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contraseña *</label>
                            <input type="password" id="contrasena" class="form-control" placeholder="Escriba la contraseña del usuario">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Rol *</label>
                            <select id="idRol" class="form-select">
                                <option value="1">ADMIN</option>
                                <option value="2">MEDICO</option>
                                <option value="3">FARMACIA</option>
                                <option value="4">REGISTRADOR_CAJA</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estado *</label>
                            <select id="estado" class="form-select">
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="text-white text-center py-4 mt-5" style="background-color: #6f42c1;">
        <div class="container">
            <p class="mb-1">© 2026 Sistema San José - Todos los derechos reservados.</p>

        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/ModoOscuro.js"></script>
	<script src="js/menuRoles.js"></script>

    <script>
        // Funciones Base
        function actualizarHora() {
            const ahora = new Date();
            document.getElementById('hora').textContent = ahora.toLocaleTimeString();
        }
        setInterval(actualizarHora, 1000);
        actualizarHora();

        const fechaElemento = document.getElementById("fecha");
        const hoy = new Date();
        fechaElemento.textContent = hoy.toLocaleDateString('es-PE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }).replace(/^./, str => str.toUpperCase());

        function cerrarSesion() {
            Swal.fire({
                title: "¿Cerrar Sesión?",
                text: "Saldrás de tu cuenta actual de forma segura.",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                cancelButtonColor: "#6c757d",
                confirmButtonText: "Sí, salir"
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('http://localhost:8080/api/usuarios/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    })
                    .then(response => { executingLimpiezaLocal(); })
                    .catch(error => { executingLimpiezaLocal(); });
                }
            });
        }
				
        function executingLimpiezaLocal() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace("./login.html"); 
        }

        // =======================================================
        // LÓGICA INTELIGENTE UNIFICADA: REGISTRO (POST) / EDICIÓN (PUT)
        // =======================================================
        const urlParams = new URLSearchParams(window.location.search);
        const idEdicion = urlParams.get('id');

        const tituloFormulario = document.getElementById('tituloFormulario');
        const formulario = document.getElementById('formularioUsuario');

        // Construcción dinámica de los botones de control
        const divBotones = document.createElement('div');
        divBotones.className = 'col-12 text-end mt-4';
        divBotones.innerHTML = `
            <a href="usuario.html" class="btn btn-outline-secondary rounded-pill px-4 me-2">Cancelar</a>
            <button type="submit" id="btnGuardar" class="btn btn-primary rounded-pill px-4">Registrar Usuario</button>
        `;
        formulario.appendChild(divBotones);

        const btnGuardar = document.getElementById('btnGuardar');
        const camposIdentidad = ['alias', 'dni', 'apellidoPaterno', 'apellidoMaterno', 'nombres', 'fechaNacimiento', 'idRol'];

        // Control de comportamiento dinámico por modo
        if (idEdicion) {
            tituloFormulario.textContent = "Editar Usuario";
            btnGuardar.textContent = "Actualizar Cambios";
            btnGuardar.className = "btn btn-success rounded-pill px-4";
            cargarDatosUsuario(idEdicion);
        } else {
            tituloFormulario.textContent = "Registrar Nuevo Usuario";
            btnGuardar.textContent = "Registrar Usuario";
            btnGuardar.className = "btn btn-primary rounded-pill px-4";
            // Modo registro: nos aseguramos de que TODO esté limpio y habilitado
            camposIdentidad.forEach(id => {
                const el = document.getElementById(id);
                if(el) el.disabled = false;
            });
        }
						
        function cargarDatosUsuario(id) {
            fetch(`http://localhost:8080/api/usuarios/${id}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Rol-Usuario': localStorage.getItem('sisaj_rol')
                }
            })
            .then(respuesta => {
                if (!respuesta.ok) throw new Error('No se pudieron obtener los datos del usuario.');
                return respuesta.json();
            })
            .then(usuario => {
                document.getElementById('codigoUsuario').value = usuario.codigoUsuario;

                document.getElementById('alias').value = usuario.alias || '';
                document.getElementById('dni').value = usuario.dni || '';
                document.getElementById('apellidoPaterno').value = usuario.apellidoPaterno || '';
                document.getElementById('apellidoMaterno').value = usuario.apellidoMaterno || '';
                document.getElementById('nombres').value = usuario.nombres || '';
                document.getElementById('fechaNacimiento').value = usuario.fechaNacimiento || '';
                
                if (usuario.idRol) {
                    document.getElementById('idRol').value = usuario.idRol;
                }

                // 🔒 BLOQUEO SELECTIVO EXCLUSIVO PARA EDICIÓN:
                camposIdentidad.forEach(idCampo => {
                    const el = document.getElementById(idCampo);
                    if (el) {
                        el.disabled = true;
                        el.classList.add('bg-light');
                    }
                });
                
                // 🔓 LOS 3 CAMPOS REALMENTE EDITABLES SIGUEN ABIERTOS:
                document.getElementById('sueldo').value = usuario.sueldo || '0.00';
                document.getElementById('contrasena').value = ''; 
                document.getElementById('contrasena').placeholder = "Escriba nueva contraseña si desea cambiarla";
                document.getElementById('estado').value = String(usuario.estado);

                document.getElementById('sueldo').disabled = false;
                document.getElementById('contrasena').disabled = false;
                document.getElementById('estado').disabled = false;
            })
            .catch(error => {
                Swal.fire('Error', error.message, 'error');
            });
        }

        formulario.addEventListener('submit', function(e) {
            e.preventDefault(); 
            btnGuardar.disabled = true;

			const datosUsuario = {
			                codigoUsuario: idEdicion ? parseInt(idEdicion) : null,
			                alias: document.getElementById('alias').value,
			                dni: document.getElementById('dni').value,
			                apellidoPaterno: document.getElementById('apellidoPaterno').value,
			                apellidoMaterno: document.getElementById('apellidoMaterno').value,
			                nombres: document.getElementById('nombres').value,
			                fechaNacimiento: document.getElementById('fechaNacimiento').value,
			                
			                // 👈 CORRECCIÓN LÓGICA AQUÍ: Cambiamos idRol por el objeto 'rol' que mapea con el @ManyToOne
			                rol: { idRol: parseInt(document.getElementById('idRol').value) }, 
			                
			                sueldo: parseFloat(document.getElementById('sueldo').value) || 0.0,
			                contrasena: document.getElementById('contrasena').value || null, 
			                estado: document.getElementById('estado').value === 'true'
			            };

            const url = idEdicion ? `http://localhost:8080/api/usuarios/${idEdicion}` : 'http://localhost:8080/api/usuarios';
            const metodo = idEdicion ? 'PUT' : 'POST';

            fetch(url, {
                method: metodo,
                headers: {
                    'Content-Type': 'application/json',
                    'Rol-Usuario': localStorage.getItem('sisaj_rol')
                },
                body: JSON.stringify(datosUsuario)
            })
            .then(respuesta => {
                if (!respuesta.ok) throw new Error('Error interno al intentar guardar el registro.');
                return respuesta.json();
            })
            .then(data => {
                Swal.fire({
                    icon: 'success',
                    title: idEdicion ? '¡Actualizado!' : '¡Registrado!',
                    text: idEdicion ? 'Los cambios se aplicaron con éxito' : 'Usuario guardado con éxito',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    window.location.href = "usuario.html";
                });
            })
            .catch(error => {
                btnGuardar.disabled = false;
                Swal.fire('Error', error.message, 'error');
            });
        });
    </script>
</body>
